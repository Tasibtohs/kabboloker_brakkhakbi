name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Install Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: false

    - name: Regenerate Gradle Wrapper
      run: |
        GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9.]+(?=-(bin|all)\.zip)' gradle/wrapper/gradle-wrapper.properties)
        echo "Using Gradle version: $GRADLE_VERSION"
        gradle wrapper --gradle-version "$GRADLE_VERSION"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate debug keystore
      run: |
        keytool -genkey -v \
          -keystore ~/.android/debug.keystore \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Decode Release Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > kabyalok-release.jks

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Kabboloker-Brakkhakbi-Debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Kabboloker-Brakkhakbi-Release
        path: app/build/outputs/apk/release/*.apk

    - name: Create Release and Upload APK
      uses: ncipollo/release-action@v1
      with:
        artifacts: "app/build/outputs/apk/Kabboloker Brakkhakbi/*.apk"
        tag: v1.0.${{ github.run_number }}
        name: "Kabboloker Brakkhakbi v1.0.${{ github.run_number }}"
        body: "✅ Release APK - Ready to install"
        draft: false
        prerelease: true
        token: ${{ secrets.GITHUB_TOKEN }}
